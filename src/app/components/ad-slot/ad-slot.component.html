@if (ativo()) {
  <section class="wrap bloco" aria-label="Publicidade">
    <p class="rotulo">Publicidade</p>
    <div class="reserva">
      <ins
        class="adsbygoogle"
        style="display:block"
        [attr.data-ad-client]="client"
        [attr.data-ad-slot]="slot()"
        data-ad-format="auto"
        data-full-width-responsive="false"
      ></ins>
    </div>
  </section>
}
