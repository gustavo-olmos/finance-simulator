<section id="duvidas" class="secao">
  <div class="pilha" data-revelar>
    <h2>Dúvidas frequentes</h2>
    <div class="lista">
      @for (f of itens; track f.pergunta; let primeiro = $first) {
        <details [attr.open]="primeiro ? '' : null">
          <summary>
            {{ f.pergunta }}
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
          </summary>
          <p>{{ f.resposta }}</p>
        </details>
      }
    </div>
  </div>
</section>
