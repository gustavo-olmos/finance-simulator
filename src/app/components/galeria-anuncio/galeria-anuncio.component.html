<div class="galeria" [class.uma]="fotos().length <= 1" [class.duas]="fotos().length === 2">
  <div class="trilho" #trilho (scroll)="onScroll()">
    @for (foto of fotos(); track foto.src; let i = $index) {
      <div class="foto">
        <img
          [src]="foto.src"
          [alt]="i === 0 ? anuncio().titulo : 'Foto ' + (i + 1) + ' de ' + fotos().length"
          [attr.loading]="i === 0 ? null : 'lazy'"
          [attr.fetchpriority]="i === 0 ? 'high' : null"
          decoding="async"
        >
      </div>
    } @empty {
      <div class="foto vazia">
        <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      </div>
    }
  </div>

  <span class="selo">ANÚNCIO</span>

  @if (fotos().length > 1) {
    <button type="button" class="ver-todas" (click)="abrir()">Ver as {{ fotos().length }} fotos</button>
    <span class="contador" aria-hidden="true">{{ atual() }} / {{ fotos().length }}</span>
  }
</div>

@if (fotos().length > 1) {
  <dialog #dialogo class="dialogo" [attr.aria-label]="'Fotos de ' + anuncio().titulo" (click)="cliqueFundo($event)">
    <div class="dialogo-topo">
      <p>{{ fotos().length }} fotos</p>
      <button type="button" class="fechar" aria-label="Fechar fotos" (click)="fechar()">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="dialogo-lista">
      @for (foto of fotos(); track foto.grande; let i = $index) {
        <img [src]="foto.grande" [alt]="'Foto ' + (i + 1) + ' de ' + fotos().length" loading="lazy" decoding="async">
      }
    </div>
  </dialog>
}
