<section id="duvidas" class="wrap secao" aria-labelledby="duvidas-titulo">
  <h2 id="duvidas-titulo">Dúvidas frequentes</h2>
  <div class="lista">
    @for (item of itens(); track item.pergunta) {
      <details>
        <summary>
          {{ item.pergunta }}
          <svg class="chev" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </summary>
        <p>{{ item.resposta }}</p>
      </details>
    }
  </div>
</section>
