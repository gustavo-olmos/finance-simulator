<h3 class="titulo">Perguntas frequentes</h3>

<div class="lista">
  @for (item of itens; track item.q; let i = $index) {
    <div class="item" [class.aberto]="abertoIndex() === i">
      <button
        class="pergunta"
        (click)="alternar(i)"
        [attr.aria-expanded]="abertoIndex() === i"
      >
        <span>{{ item.q }}</span>
        <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <div class="resposta-wrap">
        <p class="resposta">{{ item.a }}</p>
      </div>
    </div>
  }
</div>
