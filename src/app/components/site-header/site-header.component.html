<header class="site-header">
  <div class="wrap linha">
    <a class="brand" routerLink="/financiamento-imovel" aria-label="RotaFin, página inicial">
      <app-logo />
    </a>

    <nav class="nav desk-only" aria-label="Principal">
      <ng-container *ngTemplateOutlet="abas" />
      <a class="nav-link" [routerLink]="rotaSimulador()" fragment="como-funciona" queryParamsHandling="preserve">Como funciona</a>
      <a class="nav-link" [routerLink]="rotaSimulador()" fragment="duvidas" queryParamsHandling="preserve">Dúvidas</a>
    </nav>

    <div class="acoes">
      <a class="btn-anuncie desk-only" [routerLink]="rotaSimulador()" fragment="anunciar" queryParamsHandling="preserve">Anuncie aqui</a>
      <button
        type="button"
        class="btn-menu mob-only"
        [attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'"
        [attr.aria-expanded]="menuAberto()"
        aria-controls="menu-mobile"
        (click)="menuAberto.set(!menuAberto())"
      >
        @if (menuAberto()) {
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
        } @else {
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
        }
      </button>
    </div>
  </div>

  @if (menuAberto()) {
    <nav id="menu-mobile" class="menu-mobile mob-only" aria-label="Menu" (click)="menuAberto.set(false)">
      <a [routerLink]="rotaSimulador()" fragment="como-funciona" queryParamsHandling="preserve">Como funciona</a>
      <a [routerLink]="rotaSimulador()" fragment="duvidas" queryParamsHandling="preserve">Dúvidas</a>
      <a [routerLink]="rotaSimulador()" fragment="anunciar" queryParamsHandling="preserve">Anuncie aqui</a>
    </nav>
  }

  <nav class="abas-mobile mob-only" aria-label="Simulador">
    <ng-container *ngTemplateOutlet="abas" />
  </nav>
</header>

<ng-template #abas>
  <a
    class="aba"
    routerLink="/financiamento-imovel"
    [class.ativa]="temaAtivo() === 'imovel'"
    [attr.aria-current]="temaAtivo() === 'imovel' ? 'page' : null"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
    Imóvel
  </a>
  <a
    class="aba"
    routerLink="/financiamento-veiculo"
    [class.ativa]="temaAtivo() === 'veiculo'"
    [attr.aria-current]="temaAtivo() === 'veiculo' ? 'page' : null"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14"></path><path d="M3 13l2-6h14l2 6v4H3z"></path><circle cx="7.5" cy="17" r="1.6"></circle><circle cx="16.5" cy="17" r="1.6"></circle></svg>
    Veículo
  </a>
</ng-template>
