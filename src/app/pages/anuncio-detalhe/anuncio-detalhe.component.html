<app-site-header />

<!-- Versão provisória: a página do anúncio é refeita na etapa 5 do redesign. -->
<div class="pagina">
<section class="hero">
  <div class="wrap hero-wrap">
    @if (anuncio(); as a) {
      <div class="item">
        <div class="item-img" [style.background-image]="'url(' + a.imagem_url + ')'"></div>
        <div class="item-info">
          <h1 class="item-titulo">{{ a.titulo }}</h1>
          <p class="item-desc">{{ a.descricao }}</p>
          <div class="item-preco">{{ a.preco | currency: 'BRL' : 'symbol' : '1.0-0' }}</div>
        </div>
      </div>

      <div class="hero-grade">
        <app-calculadora id="calculadora" class="col-calc" />
        <app-resultado-card id="resultado" class="col-res" />
      </div>

      <a class="voltar" routerLink="/financiamento-imovel">← Voltar para o simulador</a>
    } @else {
      <div class="vazio">
        <p>Anúncio não encontrado.</p>
        <a class="voltar" routerLink="/financiamento-imovel">← Voltar para o simulador</a>
      </div>
    }
  </div>
</section>

<app-ad-slot [slot]="adsenseSlot" />

<app-site-footer />
</div>

@if (anuncio()) {
  <app-barra-resultado />
}
